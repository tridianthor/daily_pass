name: daily_pass
description: "Cross-platform daily activity tracking app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Database
  sqflite: ^2.4.1
  path: ^1.9.0

  # Calendar
  table_calendar: ^3.1.3

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4

  # File Operations
  file_picker: ^8.1.6
  path_provider: ^2.1.5

  # UI Widgets (custom packages from GitHub)
  interactive_toast:
    git:
      url: https://github.com/tridianthor/interactive_toast.git
      ref: v1.0.1
  loading_button:
    git:
      url: https://github.com/tridianthor/loading_button.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
